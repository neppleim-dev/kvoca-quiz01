<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>쑥쑥 어휘 왕국 - 맞춤법 퀴즈</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 가독성 좋고 친근한 Jua(주아체) & Gowun Dodum(고운돋움) -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <!-- Canvas Confetti (축하 폭죽 효과) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background-color: #FFFDF9;
      background-image: radial-gradient(#FFE5D9 1.5px, transparent 1.5px), radial-gradient(#D8F3DC 1.5px, #FFFDF9 1.5px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: #2B2D42;
      user-select: none;
    }
    .font-title {
      font-family: 'Jua', sans-serif;
    }
    .pastel-card {
      background: rgba(255, 255, 255, 0.95);
      border: 4px solid #F8EDEB;
      box-shadow: 0 10px 25px -5px rgba(255, 183, 178, 0.25);
    }
    .btn-bounce {
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }
    .btn-bounce:active {
      transform: scale(0.96);
    }
    .character-float {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFDF9;
    }
    ::-webkit-scrollbar-thumb {
      background: #FFB7B2;
      border-radius: 10px;
    }
  </style>
</head>
